apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ayeneh-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: ayeneh.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ayeneh-api
                port:
                  number: 80
