name: Android build

on:
  workflow_dispatch:
  push:
    branches: ["android/offline-mvp"]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export web app and sync Capacitor
        run: pnpm --filter ayeneh-web build && pnpm --filter ayeneh-web exec cap sync android

      - name: Prepare private preview signing key
        env:
          PREVIEW_KEYSTORE_B64: ${{ secrets.AYENEH_PREVIEW_KEYSTORE_B64 }}
        run: |
          test -n "$PREVIEW_KEYSTORE_B64"
          printf '%s' "$PREVIEW_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ayeneh-preview.p12"
          chmod 600 "$RUNNER_TEMP/ayeneh-preview.p12"
          echo "AYENEH_PREVIEW_KEYSTORE=$RUNNER_TEMP/ayeneh-preview.p12" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: frontend/android
        env:
          AYENEH_PREVIEW_PASSWORD: ${{ secrets.AYENEH_PREVIEW_PASSWORD }}
        run: |
          test -n "$AYENEH_PREVIEW_PASSWORD"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayeneh-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
