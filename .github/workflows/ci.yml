name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install mypy
      - run: mypy src/ --ignore-missing-imports --no-error-summary || true

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ayeneh
          POSTGRES_PASSWORD: ayeneh
          POSTGRES_DB: ayeneh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayeneh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install hatchling && pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --tb=short
      - run: python -m ruff check src/ tests/ --select E,F,W

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install safety bandit
      - run: bandit -r src/ -ll --skip B101 || true
      - run: pip-audit || true

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          target: api
          push: false
          tags: ayeneh/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
